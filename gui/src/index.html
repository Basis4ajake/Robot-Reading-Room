<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@700&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Reading Room</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <button type="button" id="theme-toggle-btn" class="theme-toggle">Switch to Bendy Toon</button>

      <h1>Robot Reading Room</h1>
      <p class="subtitle">Local knowledge library control center</p>

      <section class="status-card">
        <div class="status-header">
          <h2>Backend status</h2>
          <button id="refresh-btn" type="button">Refresh</button>
        </div>

        <dl class="status-grid">
          <dt>Server</dt>
          <dd id="server-status">checking...</dd>

          <dt>Data directory</dt>
          <dd id="data-dir">-</dd>

          <dt>Ollama</dt>
          <dd id="ollama-status">-</dd>

          <dt>Available models</dt>
          <dd id="models-list">-</dd>
        </dl>

        <p id="error-msg" class="error" hidden></p>
      </section>

      <section class="status-card">
        <div class="status-header">
          <h2>Libraries</h2>
          <button id="new-library-btn" type="button">New Library</button>
        </div>

        <ul id="library-list" class="library-list"></ul>

        <form id="create-library-form" class="library-form" hidden>
          <h3>New library</h3>

          <label>
            Library ID
            <input name="library_id" required pattern="[a-zA-Z0-9_-]+" title="Letters, numbers, hyphens, underscores only" />
          </label>
          <label>
            Name
            <input name="name" required />
          </label>
          <label>
            Description
            <textarea name="description" rows="2"></textarea>
          </label>
          <div class="form-row">
            <label>
              <span class="label-text">
                Chunk size
                <button class="info-tip" data-tooltip="How much text gets grouped into one searchable piece when your documents are processed, measured in words. Smaller chunks are more precise but can lose surrounding context; larger chunks keep more context together but can be less precise."></button>
              </span>
              <input name="chunk_size" type="number" value="300" min="1" required />
            </label>
            <label>
              <span class="label-text">
                Chunk overlap
                <button class="info-tip" data-tooltip="How much text is repeated between one chunk and the next, measured in words. A bit of overlap helps make sure important information isn't cut off right at the boundary between two chunks."></button>
              </span>
              <input name="chunk_overlap" type="number" value="60" min="0" required />
            </label>
            <label>
              <span class="label-text">
                Top K
                <button class="info-tip" data-tooltip="How many of the most relevant chunks are pulled in to help answer your question. A higher number gives the AI more information to work with, but can also add less-relevant content and slow things down."></button>
              </span>
              <input name="top_k" type="number" value="8" min="1" required />
            </label>
          </div>
          <label>
            <span class="label-text">
              LLM model
              <button class="info-tip" data-tooltip="The local Ollama model used to generate chat answers. Smaller models (1-3B) reply faster and run fine on CPU; larger models (7B+) give better answers but are slower and often need a GPU to feel responsive. You can type any model name you've pulled with Ollama, or pick one of the suggestions."></button>
              <a class="model-browse-link" href="https://ollama.com/library" target="_blank" rel="noopener" data-external-link>Browse models ↗</a>
            </span>
            <input name="llm_model" data-model-select="llm" value="qwen2:1.5b" required />
          </label>
          <label>
            <span class="label-text">
              Embedding model
              <button class="info-tip" data-tooltip="A separate local Ollama model used only to turn your document chunks into searchable vectors, not to write answers. This must be a model that supports embeddings (e.g. nomic-embed-text) - most chat models like qwen2 do not, and using one here will silently produce meaningless search results."></button>
              <a class="model-browse-link" href="https://ollama.com/search?c=embedding" target="_blank" rel="noopener" data-external-link>Browse models ↗</a>
            </span>
            <input name="embedding_model" data-model-select="embedding" value="nomic-embed-text" required />
          </label>

          <div class="form-actions">
            <button type="button" id="create-library-cancel">Cancel</button>
            <button type="submit" id="create-library-submit">Create</button>
          </div>
        </form>

        <section id="library-detail" class="library-form" hidden>
          <h3 id="library-detail-title">Library</h3>

          <form id="library-detail-form">
            <label>
              Name
              <input name="name" required />
            </label>
            <label>
              Description
              <textarea name="description" rows="2"></textarea>
            </label>
            <div class="form-row">
              <label>
                <span class="label-text">
                  Chunk size
                  <button class="info-tip" data-tooltip="How much text gets grouped into one searchable piece when your documents are processed, measured in words. Smaller chunks are more precise but can lose surrounding context; larger chunks keep more context together but can be less precise."></button>
                </span>
                <input name="chunk_size" type="number" min="1" required />
              </label>
              <label>
                <span class="label-text">
                  Chunk overlap
                  <button class="info-tip" data-tooltip="How much text is repeated between one chunk and the next, measured in words. A bit of overlap helps make sure important information isn't cut off right at the boundary between two chunks."></button>
                </span>
                <input name="chunk_overlap" type="number" min="0" required />
              </label>
              <label>
                <span class="label-text">
                  Top K
                  <button class="info-tip" data-tooltip="How many of the most relevant chunks are pulled in to help answer your question. A higher number gives the AI more information to work with, but can also add less-relevant content and slow things down."></button>
                </span>
                <input name="top_k" type="number" min="1" required />
              </label>
            </div>
            <label>
              <span class="label-text">
                LLM model
                <button class="info-tip" data-tooltip="The local Ollama model used to generate chat answers. Smaller models (1-3B) reply faster and run fine on CPU; larger models (7B+) give better answers but are slower and often need a GPU to feel responsive. You can type any model name you've pulled with Ollama, or pick one of the suggestions."></button>
                <a class="model-browse-link" href="https://ollama.com/library" target="_blank" rel="noopener" data-external-link>Browse models ↗</a>
              </span>
              <input name="llm_model" data-model-select="llm" required />
            </label>
            <label>
              <span class="label-text">
                Embedding model
                <button class="info-tip" data-tooltip="A separate local Ollama model used only to turn your document chunks into searchable vectors, not to write answers. This must be a model that supports embeddings (e.g. nomic-embed-text) - most chat models like qwen2 do not, and using one here will silently produce meaningless search results."></button>
                <a class="model-browse-link" href="https://ollama.com/search?c=embedding" target="_blank" rel="noopener" data-external-link>Browse models ↗</a>
              </span>
              <input name="embedding_model" data-model-select="embedding" required />
            </label>

            <div class="form-actions">
              <button type="button" id="library-detail-delete" class="danger">Delete</button>
              <button type="button" id="library-detail-close">Close</button>
              <button type="submit" id="library-detail-save">Save</button>
            </div>
          </form>

          <section id="sources-section" hidden>
            <div class="status-header">
              <h3>Sources</h3>
              <div class="form-actions" style="margin-top: 0">
                <button type="button" id="add-source-btn">Add file...</button>
                <button type="button" id="ingest-btn">Ingest</button>
              </div>
            </div>

            <ul id="source-list" class="library-list"></ul>

            <p id="ingest-result" hidden></p>
            <p id="sources-error-msg" class="error" hidden></p>
          </section>

          <section id="chat-section" hidden>
            <div class="status-header">
              <h3>Chat</h3>
              <span id="chat-demo-badge" class="badge" hidden>Demo mode</span>
            </div>

            <div id="chat-log" class="chat-log"></div>

            <form id="chat-form" class="chat-form">
              <input id="chat-input" type="text" placeholder="Ask a question about this library..." autocomplete="off" required />
              <button type="submit" id="chat-submit-btn">Ask</button>
            </form>

            <p id="chat-error-msg" class="error" hidden></p>
          </section>
        </section>

        <p id="library-error-msg" class="error" hidden></p>
      </section>
    </main>
  </body>
</html>
