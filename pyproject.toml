[project]
name = "local-knowledge-library"
version = "0.1.0"
description = "A local-first modular Retrieval-Augmented Generation platform for isolated knowledge libraries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyPDF2>=3.0",
    "ollama-sdk>=0.1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
